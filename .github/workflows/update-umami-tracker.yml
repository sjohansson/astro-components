name: Update Umami tracker

# @sjohansson/astro-umami bundles a copy of the Umami Cloud tracker, packages/astro-umami/vendor/umami.js. This
# compares it with https://cloud.umami.is/script.js daily. When upstream has changed it opens, or refreshes, a pull
# request with the new copy and a patch changeset, so merging releases the update and sites pick it up through
# Renovate. Pull requests opened with GITHUB_TOKEN do not start CI, so the package tests, the typecheck and Biome run
# here and the pull request opens as a draft when one fails. When upstream matches main again, the pull request is
# closed. The shared steps live in .github/actions/tracker-update-pr.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Compare with upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TRACKER: packages/astro-umami/vendor/umami.js

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh the vendored tracker
        id: refresh
        run: |
          node packages/astro-umami/scripts/update-tracker.mjs | tee "$RUNNER_TEMP/report.txt"
          if git diff --quiet -- "$TRACKER"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Describe the change
        if: steps.refresh.outputs.changed == 'true'
        run: |
          {
            echo "The Umami Cloud tracker at https://cloud.umami.is/script.js has changed. This updates the bundled copy."
            echo
            echo '```text'
            cat "$RUNNER_TEMP/report.txt"
            echo '```'
            echo
            echo "Review the upstream diff. The client test starts the new tracker, checks that it still reads \`window.umamiConfig\` and posts to \`<hostUrl>/api/send\`, and hands that request to the relay. The changeset releases a patch on merge."
          } > "$RUNNER_TEMP/body.md"

      - name: Open, refresh or close the pull request
        uses: ./.github/actions/tracker-update-pr
        with:
          changed: ${{ steps.refresh.outputs.changed }}
          package: "@sjohansson/astro-umami"
          package-dir: packages/astro-umami
          branch: chore/update-umami-tracker
          paths: ${{ env.TRACKER }}
          changeset: .changeset/update-umami-tracker.md
          summary: Update the bundled Umami tracker to upstream as of ${{ steps.refresh.outputs.date }}.
          commit-message: "chore(astro-umami): update the bundled Umami tracker (${{ steps.refresh.outputs.date }})"
          title: "chore(astro-umami): update the bundled Umami tracker"
          body-file: ${{ runner.temp }}/body.md
          token: ${{ github.token }}
