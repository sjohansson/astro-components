name: Update Umami tracker

# @sjohansson/astro-umami bundles a copy of the Umami Cloud tracker, packages/astro-umami/vendor/umami.js. This
# compares it with https://cloud.umami.is/script.js daily. When upstream has changed it opens, or refreshes, a pull
# request with the new copy and a patch changeset, so merging releases the update and sites pick it up through
# Renovate. Pull requests opened with GITHUB_TOKEN do not start CI: close and reopen the PR, or push to its branch.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Compare with upstream
    runs-on: ubuntu-latest

    env:
      BRANCH: chore/update-umami-tracker
      TRACKER: packages/astro-umami/vendor/umami.js
      CHANGESET: .changeset/update-umami-tracker.md

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Refresh the vendored tracker
        id: refresh
        run: |
          node packages/astro-umami/scripts/update-tracker.mjs | tee "$RUNNER_TEMP/report.txt"
          if git diff --quiet -- "$TRACKER"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date=$(date -u +%Y-%m-%d)
          printf -- '---\n"@sjohansson/astro-umami": patch\n---\n\nUpdate the bundled Umami tracker to upstream as of %s.\n' "$date" > "$CHANGESET"

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$TRACKER" "$CHANGESET"
          git commit -m "chore(astro-umami): update the bundled Umami tracker ($date)"
          git push --force origin "$BRANCH"

          {
            echo "The Umami Cloud tracker at https://cloud.umami.is/script.js has changed. This updates the bundled copy."
            echo
            echo '```text'
            cat "$RUNNER_TEMP/report.txt"
            echo '```'
            echo
            echo "Review the upstream diff. The client test checks that the tracker still reads \`window.umamiConfig\` and posts to \`<hostUrl>/api/send\`; run the tests on this branch since CI does not start on its own for this PR. The changeset releases a patch on merge."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/body.md"

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/body.md"
            gh pr comment "$existing" --body "Refreshed with the upstream script as of $date."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(astro-umami): update the bundled Umami tracker" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
